# __APP__ and __IMAGE__ are filled in by the central workflow. Do not set metadata.namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __APP__
  labels:
    app.kubernetes.io/name: __APP__
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: __APP__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __APP__
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: __IMAGE__
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ "ALL" ] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: __APP__
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: __APP__

